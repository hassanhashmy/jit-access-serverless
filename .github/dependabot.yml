# Keeps pinned actions and dependencies patched. Actions are pinned by commit SHA, so Dependabot
# is how they get updated, through a reviewed PR that runs the full pipeline.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: npm
    directory: /app
    schedule: { interval: weekly }
    groups: { aws-cdk: { patterns: ["aws-cdk*", "constructs"] } }
  - package-ecosystem: npm
    directory: /web
    schedule: { interval: weekly }
  - package-ecosystem: pip
    directory: /app/lambdas/python
    schedule: { interval: weekly }
  - package-ecosystem: terraform
    directory: /platform
    schedule: { interval: weekly }
