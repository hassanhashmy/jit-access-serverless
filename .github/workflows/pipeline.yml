name: pipeline

# The application layer (app/, web/). Platform Terraform has its own workflow (platform.yml).
# PRs run every check with NO AWS credentials. Only main can deploy, and it authenticates with
# GitHub OIDC -> STS -> jit-github-deploy. No stored AWS keys anywhere.
on:
  pull_request:
    branches: [main]
    paths-ignore: ["platform/**", ".github/workflows/platform.yml"]
  push:
    branches: [main]
    paths-ignore: ["platform/**", ".github/workflows/platform.yml"]
  workflow_dispatch:

permissions:
  contents: read # default for every job; only the deploy job adds id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: Test · Python (ruff, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/lambdas/python
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/lambdas/python/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  cdk:
    name: Test · CDK + TypeScript (eslint, jest, cdk-nag synth)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            web/package-lock.json
      - name: Build web app
        working-directory: web
        run: npm ci && npm run build
      - name: Install CDK app
        working-directory: app
        run: npm ci
      - name: Lint and type-check
        working-directory: app
        run: npm run lint && npm run build
      - name: Infrastructure tests
        working-directory: app
        run: npm test
      - name: Synth with cdk-nag (fails on unacknowledged findings)
        working-directory: app
        run: npx cdk synth --quiet

  security:
    name: Scan · Secrets (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # gitleaks lists the PR's commits through the GitHub API
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # full history, so secrets committed and later removed are still found
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: Deploy · App via OIDC
    needs: [python, cdk, security]
    # Only from main (after merge, or a manual run on main), and only once the platform layer exists.
    # Pull requests never reach this job, and the role's trust policy would reject them anyway.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets this job request a GitHub OIDC token (the JWT sent to AWS STS)
    concurrency:
      group: deploy-main
      cancel-in-progress: false # never cancel a CloudFormation deployment halfway
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            web/package-lock.json
      - name: Build web app
        working-directory: web
        run: npm ci && npm run build
      - name: Install CDK app
        working-directory: app
        run: npm ci
      - name: Get temporary AWS credentials (OIDC -> STS AssumeRoleWithWebIdentity)
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: gha-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: eu-west-2
      - name: Show who we are in AWS
        run: aws sts get-caller-identity
      - name: cdk deploy
        working-directory: app
        run: npx cdk deploy JitAccess --require-approval never --ci --no-notices
