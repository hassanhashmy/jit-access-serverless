name: pipeline

# PRs run every check with NO AWS credentials. Only a push to main (after merge) can deploy,
# and it authenticates with GitHub OIDC -> STS -> jit-github-deploy. No stored AWS keys anywhere.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read # default for every job; only the deploy job adds id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: Python Lambdas
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/lambdas/python
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/lambdas/python/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  cdk:
    name: CDK app, TypeScript and web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            web/package-lock.json
      - name: Build web app
        working-directory: web
        run: npm ci && npm run build
      - name: Install CDK app
        working-directory: app
        run: npm ci
      - name: Lint and type-check
        working-directory: app
        run: npm run lint && npm run build
      - name: Infrastructure tests
        working-directory: app
        run: npm test
      - name: Synth with cdk-nag (fails on unacknowledged findings)
        working-directory: app
        run: npx cdk synth --quiet

  terraform:
    name: Terraform platform
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: "1.15.2"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0 # full history, so secrets committed and later removed are still found
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Terraform misconfiguration scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: platform
          framework: terraform
          quiet: true

  deploy:
    name: Deploy (OIDC)
    needs: [python, cdk, terraform, security]
    # Only after merge to main, and only once the platform layer has been applied (role ARN set).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets this job request a GitHub OIDC token (the JWT sent to AWS STS)
    concurrency:
      group: deploy-main
      cancel-in-progress: false # never cancel a CloudFormation deployment halfway
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            app/package-lock.json
            web/package-lock.json
      - name: Build web app
        working-directory: web
        run: npm ci && npm run build
      - name: Install CDK app
        working-directory: app
        run: npm ci
      - name: Get temporary AWS credentials (OIDC -> STS AssumeRoleWithWebIdentity)
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: gha-${{ github.run_id }}-${{ github.run_attempt }}
          aws-region: eu-west-2
      - name: Show who we are in AWS
        run: aws sts get-caller-identity
      - name: cdk deploy
        working-directory: app
        run: npx cdk deploy JitAccess --require-approval never --ci --no-notices
